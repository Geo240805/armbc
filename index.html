<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Martina Beach Club">
    <meta name="description" content="Escena de realidad aumentada con a-frame">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Interacción Final</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script> 

    <script>
        AFRAME.registerComponent('drag-y-only', {
            init: function () {
                let isDragging = false;
                let lastPosition = null;
                const el = this.el;

                el.sceneEl.addEventListener('onefingerstart', (e) => {
                    isDragging = true;
                    lastPosition = { x: e.detail.position.x, y: e.detail.position.y };
                });

                el.sceneEl.addEventListener('onefingermove', (e) => {
                    if (!isDragging) return;

                    let deltaX = e.detail.position.x - lastPosition.x;
                    let deltaY = e.detail.position.y - lastPosition.y;
                    let pos = el.getAttribute('position');
                    let rot = el.getAttribute('rotation');

                    // 1. ROTACIÓN (Eje Y) - Gira solo con arrastre horizontal
                    let newRotY = rot.y + deltaX * 0.5;
                    // Mantenemos X y Z de la rotación actual para no bloquear otras rotaciones (si las hubiera)
                    el.setAttribute('rotation', { x: rot.x, y: newRotY, z: rot.z }); 

                    // 2. POSICIÓN (Eje Y) - Mueve arriba/abajo con arrastre vertical
                    let newPosY = pos.y + deltaY * -0.005; // Ajusta el factor -0.005 para sensibilidad
                    
                    // === LÍMITE DE MOVIMIENTO VERTICAL (EJE Y) ===
                    const MIN_Y = 0.05; // Altura mínima (para que no se meta en el marcador)
                    const MAX_Y = 1.0;  // Altura máxima (1 metro sobre el marcador)
                    
                    newPosY = Math.min(Math.max(newPosY, MIN_Y), MAX_Y);
                    // ============================================

                    el.setAttribute('position', { x: pos.x, y: newPosY, z: pos.z });

                    lastPosition = { x: e.detail.position.x, y: e.detail.position.y };
                });

                el.sceneEl.addEventListener('onefingerend', () => {
                    isDragging = false;
                });
            }
        });
    </script>
</head>

<body>
    <a-scene 
        vr-mode-ui="enabled: false" 
        embedded 
        gesture-detector 
        arjs="sourceType:webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-assets-item id="drink" src="./drink/drink.glb"></a-assets-item>
            <a-assets-item id="arizona" src="./arizona/Arizona.glb"></a-assets-item>
            </a-assets>

        <a-marker type="pattern" url="marker.patt">
            <a-entity 
                position="0 0.05 0" rotation="0 0 0" 
                scale="3 3 3" gltf-model="#drink" 
                
                gesture-handler                 pinch-scale="min: 1; max: 8"    drag-y-only                     >
            </a-entity>
        </a-marker>
        
        <a-marker type="pattern" url="marker1.patt">
            <a-entity 
                position="0 0.05 0" rotation="0 0 0" 
                scale="3 3 3" gltf-model="#arizona"
                
                gesture-handler
                pinch-scale="min: 1; max: 8"
                drag-y-only
                >
            </a-entity>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
