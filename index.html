<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Martina Beach Club">
    <meta name="description" content="Escena de realidad aumentada con a-frame">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martina AR Menú - Rotación con 1 Dedo</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script> 

    <script>
        AFRAME.registerComponent('rotate-y-only-gestures', {
            dependencies: ['gesture-handler'],
            init: function () {
                this.handleRotation = this.handleRotation.bind(this);
                // CAMBIO CRÍTICO: Escuchamos el arrastre de UN dedo
                this.el.addEventListener('onefingermove', this.handleRotation);
                
                // Bloqueamos el movimiento que haría el gesto de UN dedo
                this.el.setAttribute('gesture-handler', 'allowMove: false;'); 
            },
            handleRotation: function(event) {
                let rotation = this.el.getAttribute('rotation');
                
                // Aplicamos la rotación horizontal (event.detail.positionChange.x) al eje Y
                rotation.y += event.detail.positionChange.x * 0.5; 
                
                // Ignoramos completamente el movimiento vertical (eje Y del dedo)
                // y mantenemos X y Z estáticos.
                this.el.setAttribute('rotation', rotation);
            }
        });
    </script>
</head>

<body>
    <a-scene 
        vr-mode-ui="enabled: false" 
        embedded 
        gesture-detector 
        arjs="sourceType:webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-assets-item id="drink" src="./drink/drink.glb"></a-assets-item>
            <a-assets-item id="arizona" src="./arizona/Arizona.glb"></a-assets-item>
            <a-assets-item id="boing" src="./boing/Boing.glb"></a-assets-item>
            <a-assets-item id="chamoyada" src="./chamoyada/Chamoyada.glb"></a-assets-item>
            <a-assets-item id="electrolit" src="./electrolit/Electrolit.glb"></a-assets-item>
            <a-assets-item id="fercho" src="./fercho/Fercho.glb"></a-assets-item>
            <a-assets-item id="hotdog" src="./hotdog/Hotdog.glb"></a-assets-item>
        </a-assets>

        <a-marker type="pattern" url="marker.patt">
            <a-entity 
                position="0 0.05 0" rotation="0 0 0" scale="3 3 3" gltf-model="#drink"
                pinch-scale="min: 1; max: 8" rotate-y-only-gestures>
            </a-entity>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
