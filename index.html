<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AR con Gestos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script> 

</head>

<body>
    <a-scene vr-mode-ui="enabled: false" embedded gesture-detector arjs="sourceType:webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-assets-item id="drink" src="./drink/drink.glb"></a-assets-item>
            </a-assets>

        <a-marker type="pattern" url="marker.patt">
            <a-entity 
                gltf-model="#drink"
                class="clickable" 
                position="0 0.1 0" rotation="0 0 0" scale="3 3 3"
        
                animation__rotate="property: rotation; dur: 8000; easing: linear; loop: true; from: 0 0 0; to: 0 360 0; enabled: false;"

                event-set__enter="_event: mouseenter; animation__rotate.enabled: true"
                event-set__leave="_event: mouseleave; animation__rotate.enabled: false">
            </a-entity>
        </a-marker>
        
        <a-marker type="pattern" url="marker1.patt">
            <a-entity 
                gltf-model="#arizona" 
                gesture-handler
                scale="3 3 3"
                position="0 0.1 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
