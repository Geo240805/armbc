<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Martina Beach Club">
    <meta name="description" content="Escena de realidad aumentada con a-frame">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada Interacción Completa</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script> 

    <script>
        AFRAME.registerComponent('rotation-restriction', {
            init: function () {
                let isRotating = false;
                let lastPosition = null;
                const el = this.el;

                // Escucha el inicio del arrastre de UN dedo
                el.sceneEl.addEventListener('onefingerstart', (e) => {
                    isRotating = true;
                    lastPosition = { x: e.detail.position.x, y: e.detail.position.y };
                });

                // Escucha el movimiento de UN dedo
                el.sceneEl.addEventListener('onefingermove', (e) => {
                    if (!isRotating) return;

                    // Calcula el cambio de posición horizontal
                    let deltaX = e.detail.position.x - lastPosition.x;
                    let rot = el.getAttribute('rotation');
                    
                    // Solo aplica el cambio al Eje Y (yaw)
                    let newRotY = rot.y + deltaX * 0.5; // Multiplica por 0.5 para controlar la velocidad

                    el.setAttribute('rotation', { x: 0, y: newRotY, z: 0 }); 

                    lastPosition = { x: e.detail.position.x, y: e.detail.position.y };
                });

                // Escucha el final del arrastre de UN dedo
                el.sceneEl.addEventListener('onefingerend', () => {
                    isRotating = false;
                });
            }
        });
    </script>
</head>

<body>
    <a-scene 
        vr-mode-ui="enabled: false" 
        embedded 
        gesture-detector 
        arjs="sourceType:webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-assets-item id="drink" src="./drink/drink.glb"></a-assets-item>
            </a-assets>

        <a-marker type="pattern" url="marker.patt">
            <a-entity 
                position="0 0.05 0"             rotation="0 0 0" 
                scale="3 3 3" gltf-model="#drink"
                
                
                gesture-handler                 pinch-scale="min: 1; max: 8"    rotation-restriction            >
            </a-entity>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
