<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Realidad Aumentada Interactiva</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('toggle-info', {
            schema: {
                target: {type: 'string'} // Recibe el ID del panel a mostrar/ocultar
            },
            init: function () {
                let el = this.el;
                let data = this.data;
                let infoPanel = document.querySelector('#' + data.target);

                // Escucha el evento 'click' (toque en móvil)
                el.addEventListener('click', function () {
                    let isVisible = infoPanel.getAttribute('visible');
                    infoPanel.setAttribute('visible', !isVisible); // Alterna la visibilidad
                });
            }
        });
    </script>
</head>

<body>
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType:webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-assets-item id="chamoyada" src="./chamoyada/Chamoyada.glb"></a-assets-item>
        </a-assets>

        <a-marker type="pattern" url="marker3.patt">
            
            <a-entity 
                gltf-model="#chamoyada"
                class="clickable" 
                position="0 0.1 0" rotation="0 0 0" scale="3 3 3"
                toggle-info="target: info-chamoyada"> </a-entity>
            
            <a-entity id="info-chamoyada" position="0 0.5 0" visible="false">
                
                <a-plane width="1.5" height="1.0" color="#FFFFFF" opacity="0.9" position="0 1 0" rotation="0 0 0"></a-plane>
                
                <a-text
                    value="CHAMOYADA ESPECIAL\n\nBebida fría y refrescante con tamarindo, chamoy y fruta fresca.\n\n¡Toca la bebida para ocultar esta información!"
                    wrap-count="30"
                    color="#333333"
                    font="monoid"
                    align="center"
                    width="1.3"
                    position="0 1 0" 
                    rotation="0 0 0">
                </a-text>
                
            </a-entity>
        </a-marker>

        <a-camera cursor="rayOrigin: mouse;" raycaster="objects: .clickable"></a-camera>
        
    </a-scene>
</body>
</html>
