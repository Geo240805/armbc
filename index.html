<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AR Interacción Final (v3)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script> 

    <script>
        AFRAME.registerComponent('rotate-y-and-move-y-limited', {
            dependencies: ['gesture-handler'],
            init: function () {
                this.handleMove = this.handleMove.bind(this);
                this.el.addEventListener('twofingermove', this.handleMove);
                
                // LÍMITES DE MOVIMIENTO VERTICAL
                this.MIN_Y = 0.05;
                this.MAX_Y = 1.0;
                this.SENSITIVITY_POS = 0.005; // Sensibilidad de movimiento Y

                this.el.addEventListener('gesturemove', function(e) {
                    // Prevenir la rotación estándar del gesto de dos dedos si quieres usar solo esta
                    e.preventDefault(); 
                });
            },
            handleMove: function(event) {
                let rotation = this.el.getAttribute('rotation');
                let position = this.el.getAttribute('position');
                
                // 1. ROTACIÓN (Eje Y) - Arrastre horizontal (event.detail.positionChange.x)
                rotation.y += event.detail.positionChange.x * 0.5; 
                this.el.setAttribute('rotation', rotation);

                // 2. MOVIMIENTO VERTICAL (Eje Y) - Arrastre vertical (event.detail.positionChange.y)
                let calculatedPosY = position.y + event.detail.positionChange.y * -this.SENSITIVITY_POS;
                
                // Aplicar la limitación
                let finalPosY = Math.min(Math.max(calculatedPosY, this.MIN_Y), this.MAX_Y);
                
                // Actualizar la posición Y
                this.el.setAttribute('position', { x: position.x, y: finalPosY, z: position.z });
            }
        });
    </script>
</head>

<body>
    <a-scene 
        vr-mode-ui="enabled: false" 
        embedded 
        gesture-detector 
        arjs="sourceType:webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-assets-item id="drink" src="./drink/drink.glb"></a-assets-item>
            <a-assets-item id="arizona" src="./arizona/Arizona.glb"></a-assets-item>
        </a-assets>

        <a-marker type="pattern" url="marker.patt">
            <a-entity 
                position="0 0.05 0" rotation="0 0 0" 
                scale="3 3 3" gltf-model="#drink" 
                
                gesture-handler                 pinch-scale="min: 1; max: 8"    rotate-y-and-move-y-limited     >
            </a-entity>
        </a-marker>
        
        <a-marker type="pattern" url="marker1.patt">
            <a-entity 
                position="0 0.05 0" rotation="0 0 0" 
                scale="3 3 3" gltf-model="#arizona"
                
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotate-y-and-move-y-limited
                >
            </a-entity>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
