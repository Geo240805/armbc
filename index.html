<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Martina Beach Club">
    <meta name="description" content="Escena de realidad aumentada con a-frame">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada Interacción Completa</title>

    <!-- Librerías principales -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>

    <!-- Extras: cargador GLTF, gestos -->
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <!-- Componente para restringir rotación -->
    <script>
        AFRAME.registerComponent('rotation-restriction', {
            init: function () {
                let isRotating = false;
                let lastPosition = null;
                const el = this.el;

                // Inicia rotación con un dedo
                el.sceneEl.addEventListener('onefingerstart', (e) => {
                    isRotating = true;
                    lastPosition = { x: e.detail.position.x, y: e.detail.position.y };
                });

                // Movimiento de un dedo
                el.sceneEl.addEventListener('onefingermove', (e) => {
                    if (!isRotating) return;

                    let deltaX = e.detail.position.x - lastPosition.x;
                    let rot = el.getAttribute('rotation');
                    let newRotY = rot.y + deltaX * 0.5;

                    // Aplica solo rotación en Y
                    el.setAttribute('rotation', { x: 0, y: newRotY, z: 0 });

                    lastPosition = { x: e.detail.position.x, y: e.detail.position.y };
                });

                // Fin del gesto
                el.sceneEl.addEventListener('onefingerend', () => {
                    isRotating = false;
                });
            }
        });
    </script>
</head>

<body>
    <a-scene 
        vr-mode-ui="enabled: false"
        embedded 
        gesture-detector 
        arjs="sourceType:webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Modelos -->
        <a-assets>
            <a-assets-item id="drink" src="./drink/drink.glb"></a-assets-item>
            <a-assets-item id="arizona" src="./arizona/Arizona.glb"></a-assets-item>
            <a-assets-item id="boing" src="./boing/Boing.glb"></a-assets-item>
            <a-assets-item id="chamoyada" src="./chamoyada/Chamoyada.glb"></a-assets-item>
            <a-assets-item id="electrolit" src="./electrolit/Electrolit.glb"></a-assets-item>
            <a-assets-item id="fercho" src="./fercho/Fercho.glb"></a-assets-item>
            <a-assets-item id="hotdog" src="./hotdog/Hotdog.glb"></a-assets-item>
        </a-assets>

        <!-- Marcadores -->
        <a-marker type="pattern" url="marker.patt">
            <a-entity 
                position="0 0.05 0"
                rotation="0 0 0"
                scale="3 3 3"
                gltf-model="#drink"
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotation-restriction>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker1.patt">
            <a-entity 
                position="0 0.05 0"
                rotation="0 0 0"
                scale="3 3 3"
                gltf-model="#arizona"
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotation-restriction>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker2.patt">
            <a-entity 
                position="0 0.05 0"
                rotation="0 0 0"
                scale="3 3 3"
                gltf-model="#boing"
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotation-restriction>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker3.patt">
            <a-entity 
                position="0 0.05 0"
                rotation="0 0 0"
                scale="3 3 3"
                gltf-model="#chamoyada"
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotation-restriction>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker4.patt">
            <a-entity 
                position="0 0.05 0"
                rotation="0 0 0"
                scale="3 3 3"
                gltf-model="#electrolit"
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotation-restriction>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker5.patt">
            <a-entity 
                position="0 0.05 0"
                rotation="0 0 0"
                scale="3 3 3"
                gltf-model="#fercho"
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotation-restriction>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker6.patt">
            <a-entity 
                position="0 0.05 0"
                rotation="0 0 0"
                scale="3 3 3"
                gltf-model="#hotdog"
                gesture-handler
                pinch-scale="min: 1; max: 8"
                rotation-restriction>
            </a-entity>
        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
