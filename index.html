<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Martina Beach Club">
    <meta name="description" content="Escena de realidad aumentada con a-frame">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
</head>

<body>
    <!--Escena-->
    <a-scene vr-mode-ui="enabled: false" markerhandler embedded arjs="sourceType:webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; ">
        <!--Aqui almacenaremos nuestros assets si tenemos mas de un modelo-->
        <a-assets>
            <!--Este sera el modelo del drink-->
            <a-assets-item id="drink" src="./drink/drink.glb"></a-assets-item>
            <a-assets-item id="arizona" src="./arizona/Arizona.glb"></a-assets-item>
            <a-assets-item id="boing" src="./boing/Boing.glb"></a-assets-item>
            <a-assets-item id="chamoyada" src="./chamoyada/Chamoyada.glb"></a-assets-item>
            <a-assets-item id="electrolit" src="./electrolit/Electrolit.glb"></a-assets-item>
            <a-assets-item id="fercho" src="./fercho/Fercho.glb"></a-assets-item>
            <a-assets-item id="hotdog" src="./hotdog/Hotdog.glb"></a-assets-item>
        </a-assets>

        <!--Aqui definimos el marcador que sera necesario para mostrar el modelo-->
        <a-marker type="pattern" url=" marker.patt">
            <!--Aqui pondremos los ajustes(posicion,rotacion,escala,nombre del modelo, animacion) de nuestro modelo 3D-->
            <a-entity position="0 0.1 0" rotation="0 0 0" scale="3 3 3" gltf-model="#drink" animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from: 0 0 0; to: 0 360 0; loop: true"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker1.patt">
            <!--Aqui pondremos los ajustes(posicion,rotacion,escala,nombre del modelo, animacion) de nuestro modelo 3D-->
            <a-entity position="0 0.1 0" rotation="0 0 0" scale="3 3 3" gltf-model="#arizona" animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from: 0 0 0; to: 0 360 0; loop: true"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker2.patt">
            <!--Aqui pondremos los ajustes(posicion,rotacion,escala,nombre del modelo, animacion) de nuestro modelo 3D-->
            <a-entity position="0 0.1 0" rotation="0 0 0" scale="3 3 3" gltf-model="#boing" animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from: 0 0 0; to: 0 360 0; loop: true"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker3.patt">
            <!--Aqui pondremos los ajustes(posicion,rotacion,escala,nombre del modelo, animacion) de nuestro modelo 3D-->
            <a-entity position="0 0.1 0" rotation="0 0 0" scale="3 3 3" gltf-model="#chamoyada" animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from: 0 0 0; to: 0 360 0; loop: true"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker4.patt">
            <!--Aqui pondremos los ajustes(posicion,rotacion,escala,nombre del modelo, animacion) de nuestro modelo 3D-->
            <a-entity position="0 0.1 0" rotation="0 0 0" scale="3 3 3" gltf-model="#electrolit" animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from: 0 0 0; to: 0 360 0; loop: true"></a-entity>
        </a-marker>


        <!--Esta entidad sera la camara-->
        <a-entity camera="zoom: 2;"></a-entity>
    </a-scene>
</body>

</html>
